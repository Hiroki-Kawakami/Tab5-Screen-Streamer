[workspace]
members = ["crates/core", "crates/device", "crates/capture", "crates/input", "crates/stream", "crates/cli", "crates/app", "crates/wasm", "crates/xtask"]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
nusb = "0.2.7"
streamer-capture = { path = "crates/capture" }
streamer-core = { path = "crates/core" }
streamer-device = { path = "crates/device" }
streamer-input = { path = "crates/input" }
streamer-stream = { path = "crates/stream" }
