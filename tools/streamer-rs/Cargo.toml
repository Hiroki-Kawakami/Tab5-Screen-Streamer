[workspace]
members = ["crates/core", "crates/device", "crates/cli"]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
nusb = "0.2.7"
streamer-core = { path = "crates/core" }
streamer-device = { path = "crates/device" }
