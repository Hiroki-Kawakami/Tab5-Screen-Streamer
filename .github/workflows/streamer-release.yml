name: Streamer release

on:
  push:
    tags:
      - "streamer-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: tools/streamer-rs
    steps:
      - uses: actions/checkout@v4
      - if: startsWith(github.ref, 'refs/tags/streamer-v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "streamer-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - run: cargo xtask dist
      - uses: actions/upload-artifact@v4
        with:
          name: Tab5-Streamer-${{ matrix.target }}
          path: tools/streamer-rs/target/dist/Tab5-Streamer-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/streamer-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - working-directory: dist
        run: sha256sum Tab5-Streamer-* > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "Tab5 Streamer ${GITHUB_REF_NAME#streamer-}" --notes ""
      - run: |
          git tag -f streamer-latest "$GITHUB_SHA"
          git push -f origin streamer-latest
      - run: |
          gh release view streamer-latest > /dev/null 2>&1 ||
            gh release create streamer-latest --latest=false --title "Tab5 Streamer (latest)" --notes ""
          gh release upload streamer-latest dist/* --clobber
