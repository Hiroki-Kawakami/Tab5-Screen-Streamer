[package]
name = "tab5-screen-streamer"
description = "Stream PC Screen Capture to M5Stack Tab5"
repository = "https://github.com/Hiroki-Kawakami/Tab5-Screen-Streamer"
version = "0.2.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
fast_image_resize = "5.3.0"
futures-lite = "2.6.1"
nusb = "0.2.1"
turbojpeg = "1.3.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", features = ["objc2-io-surface"] }
objc2-io-surface = "0.3.2"
block2 = "0.6.2"
dispatch2 = "0.3.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "1.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
scap = "0.0.8"

[profile.release]
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
